<!-- templates/report.html -->
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Звіт за місяць</title>
</head>
<body>
    <h2>Перегляд доходів за місяць</h2>
    <form method="post">
        <label>Оберіть місяць (YYYY-MM):</label><br>
        <input type="month" name="month" required><br><br>
        <button type="submit">Показати</button>
    </form>

    {% if result %}
        <h3>Звіт за {{ result.month }}</h3>
        <p>Зарплата: {{ result.salary }} грн</p>
        <p>Пенсія: {{ result.pension }} грн</p>
        <p><strong>Всього: {{ result.total }} грн</strong></p>
    {% endif %}

    <br>
    <a href="/">← Назад</a>
</body>
</html>
